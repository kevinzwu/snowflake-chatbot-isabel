name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, do not use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pnpm demo`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How are you running Isabel?
      options:
        - Demo mode (pnpm demo)
        - Local, against my own Snowflake
        - Deployed (AWS / Terraform)
        - Deployed (other)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove secrets, account names, hostnames and personal data before pasting.
      render: shell
